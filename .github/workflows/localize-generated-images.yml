name: Localize generated recipe images

on:
  push:
    paths:
      - "tools/localize_recipe_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local recipe images and replace external image URLs
        run: python tools/localize_recipe_images.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html assets/generated
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Replace third-party recipe images with generated local images [skip localize]"
            git push
          fi
