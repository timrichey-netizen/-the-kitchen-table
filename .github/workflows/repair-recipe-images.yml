name: Repair split recipe images
on:
  push:
    paths:
      - "assets/repair-four-recipes.png"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Crop clean recipe photos
        run: |
          python - <<'PY'
          from PIL import Image
          src=Image.open("assets/repair-four-recipes.png").convert("RGB")
          boxes=[
            ("gnocchi-alla-sorrentina.png",(36,38,463,393)),
            ("cioppino.png",(500,38,933,393)),
            ("spaghetti-with-mussels.png",(970,38,1402,393)),
            ("butternut-squash-ravioli-brown-butter-sage.png",(1438,38,1870,393)),
          ]
          for name,box in boxes:
              im=src.crop(box)
              im=im.resize((800,600),Image.Resampling.LANCZOS)
              im.save("assets/"+name,"PNG",optimize=True)
          PY
      - name: Commit repaired local images
        run: |
          rm assets/repair-four-recipes.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Repair split recipe images"
          git push
