name: Cross-reference broths to recipes
on:
  push:
    paths: ["tools/cross_reference_broths.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/cross_reference_broths.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Cross-reference broth recipes with applicable dishes"
            git push
          fi
