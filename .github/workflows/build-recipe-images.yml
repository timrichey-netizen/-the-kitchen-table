name: Build recipe images

on:
  push:
    paths:
      - ".image-upload/**"

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for all image chunks
        id: chunks
        run: |
          if [ ! -f .image-upload/part-07 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pillow
        if: steps.chunks.outputs.ready == 'true'
        run: python -m pip install pillow

      - name: Rebuild and crop recipe images
        if: steps.chunks.outputs.ready == 'true'
        run: |
          cat .image-upload/part-* | base64 -d > /tmp/recipe-sprite.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          slugs = [
            "shrimp-piccata-skewers",
            "spaghetti-carbonara",
            "pasta-cacio-e-pepe",
            "rigatoni-amatriciana",
            "perciatelli-alla-gricia",
            "fettuccine-alfredo",
            "pasta-e-ceci",
            "rigatoni-pecorino-crispy-guanciale",
            "rigatoni-pork-ragu-ricotta",
            "penne-arrabbiata",
            "bucatini-amatriciana",
            "spaghetti-shrimp-lemon-mint-pecorino",
            "osso-buco-red-wine",
            "eggplant-parmesan",
            "lemon-stuffed-grilled-branzino",
            "creamy-seafood-risotto",
            "florentine-steak-balsamic-rosemary",
            "pasta-alla-norma",
            "pork-chop-milanese",
            "gnocchi-alla-sorrentina",
            "cioppino",
            "spaghetti-with-mussels",
            "butternut-squash-ravioli-brown-butter-sage"
          ]

          sheet = Image.open("/tmp/recipe-sprite.jpg").convert("RGB")
          tile_w, tile_h = 256, 192
          out = Path("assets")
          out.mkdir(exist_ok=True)

          for i, slug in enumerate(slugs):
              col, row = i % 6, i // 6
              crop = sheet.crop((col*tile_w, row*tile_h, (col+1)*tile_w, (row+1)*tile_h))
              crop.save(out / f"{slug}.png", "PNG", optimize=True)
          PY

      - name: Commit generated images
        if: steps.chunks.outputs.ready == 'true'
        run: |
          rm -rf .image-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .image-upload
          git commit -m "Publish 23 recipe images"
          git push
