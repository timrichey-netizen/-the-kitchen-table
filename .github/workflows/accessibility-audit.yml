name: Accessibility regression audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate accessible page structure
        run: node tools/audit-accessibility.mjs
