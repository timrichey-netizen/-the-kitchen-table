name: Add Mexican dessert recipes

on:
  push:
    paths:
      - "tools/add_mexican_desserts.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dessert recipes and generated images
        run: python tools/add_mexican_desserts.py
      - name: Commit generated recipes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html assets/generated-desserts
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add Mexican dessert recipes with generated local images"
            git push
          fi
