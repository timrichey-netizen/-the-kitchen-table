name: Add broth and stock recipes

on:
  push:
    paths:
      - "tools/add_broths_and_stocks.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Build broth recipes and local generated images
        run: python tools/add_broths_and_stocks.py
      - name: Commit broth collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html assets/generated-broths
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add broth and stock recipes with generated local images"
            git push
          fi
