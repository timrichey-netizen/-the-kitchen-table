<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping List | The Kitchen Table</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="commerce.css"><style>main{max-width:850px;margin:100px auto 60px;padding:20px}.shopping-entry{padding:20px;border:1px solid #dccfbe;margin:18px 0;background:#fffdf9}.shopping-entry h2{font-size:28px!important}.shopping-entry li{margin:7px 0}.shopping-actions{display:flex;gap:12px;flex-wrap:wrap}.shopping-actions button{padding:10px 18px;background:#fff8ed;border:1px solid #cbb8a3;cursor:pointer}@media print{nav,.shopping-actions,.shopping-entry button{display:none!important}main{margin:0;padding:0}.shopping-entry{break-inside:avoid}}</style></head><body><main><a href="index.html#recipes">← Back to recipes</a><h1>My Shopping List</h1><p>Ingredients from recipes you selected on this device. Quantities are kept as written in each recipe; duplicate ingredients are not combined automatically.</p><div class="shopping-actions"><button id="shoppingPrint" type="button">Print shopping list</button><button id="shoppingCopy" type="button">Copy shopping list</button><button id="shoppingClear" type="button">Clear list</button></div><p id="shoppingStatus" role="status" aria-live="polite"></p><div id="shoppingItems"></div></main><script>(function(){const key='kitchen-table-shopping-list-v1',target=document.getElementById('shoppingItems'),status=document.getElementById('shoppingStatus');function load(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(data)?data.filter(x=>x&&typeof x.title==='string'&&Array.isArray(x.ingredients)):[]}catch(e){return[]}}function show(){target.replaceChildren();const rows=load();if(!rows.length){target.textContent='No recipes added yet. Open a recipe and select Add to combined list.';return}rows.forEach(row=>{const box=document.createElement('section');box.className='shopping-entry';const h=document.createElement('h2');h.textContent=row.title;box.append(h);const ul=document.createElement('ul');row.ingredients.forEach(text=>{const li=document.createElement('li');li.textContent=text;ul.append(li)});box.append(ul);const remove=document.createElement('button');remove.textContent='Remove recipe';remove.addEventListener('click',()=>{localStorage.setItem(key,JSON.stringify(load().filter(x=>x.url!==row.url)));show()});box.append(remove);target.append(box)})}document.getElementById('shoppingClear').addEventListener('click',()=>{localStorage.removeItem(key);show()});document.getElementById('shoppingPrint').addEventListener('click',()=>window.print());document.getElementById('shoppingCopy').addEventListener('click',()=>{const text=load().map(row=>row.title+'\n'+row.ingredients.map(x=>'□ '+x).join('\n')).join('\n\n');navigator.clipboard?.writeText(text).then(()=>{status.textContent='Shopping list copied'}).catch(()=>{status.textContent='Copy is unavailable in this browser'})});show()})();</script></body></html>
